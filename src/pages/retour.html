<!DOCTYPE html>
<html lang="fr">
<head>
  {{> head }}
  <title>Formulaire de Retour — e-Sol</title>
  <style>
    .retour-form { padding: 48px; max-width: 700px; margin: 0 auto; }

    .form-group { margin-bottom: 24px; }

    .form-label {
      display: block;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-label .required { color: var(--primary); margin-left: 2px; }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--text-main);
      background: var(--bg-surface);
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-10);
    }

    .form-textarea { resize: vertical; min-height: 160px; }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text-subtle); }

    /* Emoji rating */
    .emoji-rating {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .emoji-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg-surface);
      font-size: 28px;
      cursor: pointer;
      transition: all 0.25s var(--ease-out);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji-btn:hover {
      transform: scale(1.15);
      border-color: var(--primary);
      box-shadow: 0 4px 12px var(--primary-10);
    }

    .emoji-btn.selected {
      border-color: var(--primary);
      background: var(--primary-10);
      transform: scale(1.15);
      box-shadow: 0 4px 16px rgba(156,63,0,0.2);
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-subtle);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  {{> header }}

  <div class="page-hero">
    <div class="container">
      <span class="badge badge-olive mb-4">Amélioration Continue</span>
      <h1>Laisser un retour</h1>
      <p>Aidez-nous à améliorer e-Sol. Bugs, idées, suggestions — chaque retour compte pour faire évoluer la plateforme.</p>
    </div>
  </div>

  <section class="section-sm">
    <div class="container">
      <div class="glass-card retour-form no-hover">

        <div class="form-group text-center">
          <label class="form-label" style="font-size: 16px; text-align: center;">Comment évaluez-vous votre expérience sur e-Sol ?</label>
          <div class="emoji-rating mt-4">
            <button class="emoji-btn" data-val="1" title="Très insatisfait">😟</button>
            <button class="emoji-btn" data-val="2" title="Insatisfait">😕</button>
            <button class="emoji-btn" data-val="3" title="Neutre">😐</button>
            <button class="emoji-btn" data-val="4" title="Satisfait">🙂</button>
            <button class="emoji-btn" data-val="5" title="Très satisfait">🤩</button>
          </div>
        </div>

        <hr style="border: none; height: 1px; background: var(--border); margin: 32px 0;">

        <div class="form-group">
          <label class="form-label">Type de retour <span class="required">*</span></label>
          <select class="form-select">
            <option value="">Choisir…</option>
            <option>🐛 Signaler un bug</option>
            <option>💡 Suggérer une amélioration</option>
            <option>✨ Proposer une nouvelle fonctionnalité</option>
            <option>📝 Retour général</option>
            <option>🙏 Remerciement</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Votre retour <span class="required">*</span></label>
          <textarea class="form-textarea" placeholder="Décrivez votre bug, votre suggestion ou votre retour de manière détaillée…"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Email (optionnel)</label>
          <input type="email" class="form-input" placeholder="Pour être notifié de la résolution">
          <p class="form-hint">Laissez vide si vous préférez rester anonyme.</p>
        </div>

        <button class="btn btn-primary btn-lg w-full" style="justify-content: center;" onclick="alert('Ceci est une démonstration. Le formulaire réel est sur e-sol.fr')">
          <i class="fas fa-paper-plane"></i> Envoyer mon retour
        </button>

      </div>
    </div>
  </section>

  {{> footer }}

  <script>
    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  </script>

</body>
</html>
