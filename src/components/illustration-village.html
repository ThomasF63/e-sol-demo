<!--
  Le village e-Sol — décor dessiné à la main.

  Ce fichier contient tout ce qui est immuable : le ciel, les collines, la place,
  les cinq lieux partagés, les jardins, le sol, et les scènes de chaque communauté
  sous forme de <symbol id="vg-{id}">.

  Les maisons, elles, ne sont PAS écrites ici : elles sont générées depuis
  src/data/communities.json par scripts/generate-village.js et injectées plus bas,
  à l'inclusion du composant village-maisons. Ajouter une communauté au JSON suffit.
  (Ne pas écrire la syntaxe d'inclusion dans ce commentaire : build.js la résoudrait
  ici aussi, et le village se retrouverait dessiné deux fois.)

  Pour donner une scène à une nouvelle communauté : ajouter un <symbol id="vg-{id}"
  viewBox="0 0 84 52"> dans les défs ci-dessous. Sans scène dédiée, le générateur
  retombe sur l'emblème de la catégorie (vgc-*), puis sur vg-neutre.

  Zéro dépendance externe, aucun JavaScript, texte en <text>.
-->
