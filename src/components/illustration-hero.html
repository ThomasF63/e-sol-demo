<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" fill="none" role="img" aria-label="Illustration de personnes collaborant autour de la science des sols">

  <!-- ======= Background Shapes ======= -->
  <circle cx="120" cy="380" r="200" fill="#9c3f00" opacity="0.035"/>
  <circle cx="700" cy="80" r="220" fill="#586330" opacity="0.04"/>
  <circle cx="410" cy="220" r="260" fill="#c05814" opacity="0.018"/>

  <!-- ======= Connection Lines (network) ======= -->
  <g stroke="#9c3f00" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.18">
    <line x1="145" y1="235" x2="310" y2="200"/>
    <line x1="310" y1="200" x2="510" y2="195"/>
    <line x1="510" y1="195" x2="680" y2="230"/>
    <line x1="145" y1="235" x2="510" y2="195"/>
    <line x1="310" y1="200" x2="680" y2="230"/>
  </g>
  <!-- Connection dots -->
  <g fill="#9c3f00" opacity="0.25">
    <circle cx="145" cy="235" r="4"/>
    <circle cx="310" cy="200" r="4"/>
    <circle cx="510" cy="195" r="4"/>
    <circle cx="680" cy="230" r="4"/>
  </g>

  <!-- ======= Soil Cross-Section (center) ======= -->
  <g transform="translate(310, 240)">
    <!-- Shadow -->
    <ellipse cx="100" cy="185" rx="115" ry="12" fill="#1a1512" opacity="0.06"/>
    <!-- Main soil block -->
    <rect x="0" y="0" width="200" height="180" rx="14" fill="#d4c4a8"/>
    <!-- Topsoil layer -->
    <rect x="0" y="0" width="200" height="55" rx="14" fill="#8B7355"/>
    <rect x="0" y="40" width="200" height="15" fill="#8B7355"/>
    <!-- Subsoil layer -->
    <rect x="0" y="55" width="200" height="60" fill="#a08562"/>
    <!-- Parent material -->
    <rect x="0" y="115" width="200" height="65" fill="#c4aa82"/>
    <!-- Bottom rounding -->
    <rect x="0" y="155" width="200" height="25" rx="14" fill="#c4aa82"/>
    <!-- Soil texture details -->
    <circle cx="30" cy="25" r="3" fill="#7a6348" opacity="0.3"/>
    <circle cx="85" cy="18" r="2.5" fill="#7a6348" opacity="0.25"/>
    <circle cx="155" cy="32" r="3.5" fill="#7a6348" opacity="0.2"/>
    <circle cx="60" cy="42" r="2" fill="#7a6348" opacity="0.3"/>
    <circle cx="130" cy="38" r="2.5" fill="#7a6348" opacity="0.2"/>
    <!-- Subsoil pebbles -->
    <ellipse cx="45" cy="80" rx="8" ry="5" fill="#b09570" opacity="0.5" transform="rotate(-15,45,80)"/>
    <ellipse cx="140" cy="90" rx="6" ry="4" fill="#b09570" opacity="0.4" transform="rotate(20,140,90)"/>
    <ellipse cx="90" cy="100" rx="7" ry="4" fill="#b09570" opacity="0.3" transform="rotate(-8,90,100)"/>
    <!-- Parent material stones -->
    <ellipse cx="55" cy="140" rx="12" ry="7" fill="#d4bc96" opacity="0.5" transform="rotate(10,55,140)"/>
    <ellipse cx="150" cy="150" rx="10" ry="6" fill="#d4bc96" opacity="0.4" transform="rotate(-12,150,150)"/>

    <!-- ---- Root system ---- -->
    <g stroke="#6d7a45" fill="none" stroke-linecap="round" opacity="0.55">
      <!-- Main taproot -->
      <path d="M100,0 Q100,30 98,60 Q96,90 100,120" stroke-width="3"/>
      <!-- Left branches -->
      <path d="M99,30 Q80,45 60,55" stroke-width="2"/>
      <path d="M60,55 Q45,60 35,65" stroke-width="1.5"/>
      <path d="M98,60 Q70,75 50,90" stroke-width="2"/>
      <path d="M50,90 Q35,100 25,115" stroke-width="1.2"/>
      <path d="M50,90 Q45,105 40,120" stroke-width="1"/>
      <path d="M99,90 Q80,110 65,130" stroke-width="1.5"/>
      <!-- Right branches -->
      <path d="M100,25 Q120,40 140,48" stroke-width="2"/>
      <path d="M140,48 Q155,55 165,60" stroke-width="1.5"/>
      <path d="M100,55 Q125,70 150,82" stroke-width="2"/>
      <path d="M150,82 Q160,95 170,110" stroke-width="1.2"/>
      <path d="M100,85 Q120,100 145,115" stroke-width="1.5"/>
      <path d="M145,115 Q155,125 160,140" stroke-width="1"/>
    </g>

    <!-- ---- Plant growing from soil ---- -->
    <g transform="translate(100, 0)">
      <!-- Main stem -->
      <path d="M0,0 Q-2,-25 0,-55 Q2,-85 -1,-120" stroke="#586330" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Left branch -->
      <path d="M-1,-70 Q-15,-80 -25,-75" stroke="#586330" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Right branch -->
      <path d="M0,-90 Q15,-100 22,-95" stroke="#586330" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Leaves -->
      <ellipse cx="-30" cy="-78" rx="22" ry="9" fill="#586330" transform="rotate(-25,-30,-78)"/>
      <ellipse cx="-28" cy="-78" rx="20" ry="8" fill="#6d8035" transform="rotate(-25,-28,-78)"/>
      <ellipse cx="28" cy="-98" rx="20" ry="8" fill="#586330" transform="rotate(20,28,-98)"/>
      <ellipse cx="30" cy="-98" rx="18" ry="7" fill="#6d8035" transform="rotate(20,30,-98)"/>
      <!-- Top leaves -->
      <ellipse cx="-12" cy="-122" rx="18" ry="8" fill="#586330" transform="rotate(-35,-12,-122)"/>
      <ellipse cx="8" cy="-128" rx="16" ry="7" fill="#6d8035" transform="rotate(30,8,-128)"/>
      <ellipse cx="-3" cy="-135" rx="12" ry="6" fill="#7a9040" transform="rotate(-10,-3,-135)"/>
    </g>
  </g>

  <!-- ======= Person 1: Scientist with magnifying glass (left) ======= -->
  <g transform="translate(95, 215)">
    <!-- Shadow -->
    <ellipse cx="18" cy="145" rx="22" ry="5" fill="#1a1512" opacity="0.06"/>
    <!-- Legs -->
    <rect x="8" y="100" width="10" height="40" rx="4" fill="#3d3d5c"/>
    <rect x="22" y="100" width="10" height="40" rx="4" fill="#3d3d5c"/>
    <!-- Shoes -->
    <rect x="5" y="135" width="16" height="8" rx="4" fill="#4a3728"/>
    <rect x="19" y="135" width="16" height="8" rx="4" fill="#4a3728"/>
    <!-- Body -->
    <rect x="2" y="50" width="36" height="55" rx="8" fill="#9c3f00"/>
    <!-- Lab coat over body -->
    <rect x="-2" y="52" width="44" height="50" rx="8" fill="#f5f0e8"/>
    <rect x="12" y="52" width="16" height="50" rx="2" fill="#e8e0d2"/>
    <!-- Arms -->
    <!-- Left arm holding magnifying glass -->
    <rect x="-14" y="58" width="12" height="36" rx="5" fill="#f0c5a0" transform="rotate(-20,-8,76)"/>
    <!-- Right arm -->
    <rect x="40" y="62" width="12" height="30" rx="5" fill="#f0c5a0" transform="rotate(15,46,77)"/>
    <!-- Head -->
    <circle cx="20" cy="38" r="16" fill="#f0c5a0"/>
    <!-- Hair -->
    <path d="M4,32 Q4,18 20,16 Q36,18 36,32" fill="#4a3728"/>
    <rect x="4" y="25" width="32" height="8" rx="4" fill="#4a3728"/>
    <!-- Glasses -->
    <circle cx="13" cy="38" r="5" stroke="#4a3728" stroke-width="1.5" fill="none"/>
    <circle cx="27" cy="38" r="5" stroke="#4a3728" stroke-width="1.5" fill="none"/>
    <line x1="18" y1="38" x2="22" y2="38" stroke="#4a3728" stroke-width="1.5"/>
    <!-- Magnifying glass -->
    <g transform="translate(-28, 60) rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#8c7166" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-10" r="14" stroke="#8c7166" stroke-width="3" fill="#c5e8f7" opacity="0.4"/>
      <circle cx="0" cy="-10" r="14" stroke="#8c7166" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- ======= Person 2: Data analyst at laptop (center-left) ======= -->
  <g transform="translate(250, 225)">
    <!-- Desk -->
    <rect x="-15" y="95" width="90" height="6" rx="3" fill="#c4aa82"/>
    <rect x="-5" y="101" width="6" height="40" rx="2" fill="#b09570"/>
    <rect x="65" y="101" width="6" height="40" rx="2" fill="#b09570"/>
    <!-- Shadow under desk -->
    <ellipse cx="35" cy="145" rx="40" ry="5" fill="#1a1512" opacity="0.05"/>
    <!-- Chair -->
    <rect x="20" y="75" width="30" height="25" rx="6" fill="#4e4e88" opacity="0.8"/>
    <!-- Legs -->
    <rect x="22" y="100" width="10" height="38" rx="4" fill="#4a5568"/>
    <rect x="38" y="100" width="10" height="38" rx="4" fill="#4a5568"/>
    <!-- Shoes -->
    <rect x="20" y="133" width="14" height="7" rx="3" fill="#4a3728"/>
    <rect x="36" y="133" width="14" height="7" rx="3" fill="#4a3728"/>
    <!-- Body (seated) -->
    <rect x="16" y="48" width="38" height="45" rx="8" fill="#586330"/>
    <!-- Arms reaching to laptop -->
    <rect x="6" y="56" width="12" height="32" rx="5" fill="#f0c5a0" transform="rotate(-10,12,72)"/>
    <rect x="50" y="56" width="12" height="32" rx="5" fill="#f0c5a0" transform="rotate(10,56,72)"/>
    <!-- Hands on desk level -->
    <circle cx="8" cy="88" r="5" fill="#f0c5a0"/>
    <circle cx="62" cy="88" r="5" fill="#f0c5a0"/>
    <!-- Head -->
    <circle cx="35" cy="34" r="16" fill="#d4a574"/>
    <!-- Hair (curly) -->
    <path d="M19,28 Q19,14 35,12 Q51,14 51,28" fill="#3d2b1f"/>
    <circle cx="22" cy="22" r="5" fill="#3d2b1f"/>
    <circle cx="35" cy="18" r="5" fill="#3d2b1f"/>
    <circle cx="48" cy="22" r="5" fill="#3d2b1f"/>
    <!-- Laptop on desk -->
    <g transform="translate(15, 68)">
      <!-- Screen -->
      <rect x="0" y="-30" width="40" height="28" rx="3" fill="#2d3748"/>
      <rect x="3" y="-27" width="34" height="22" rx="2" fill="#e2e8f0"/>
      <!-- Chart on screen -->
      <rect x="6" y="-24" width="5" height="8" rx="1" fill="#9c3f00" opacity="0.7"/>
      <rect x="13" y="-22" width="5" height="6" rx="1" fill="#586330" opacity="0.7"/>
      <rect x="20" y="-26" width="5" height="10" rx="1" fill="#4e4e88" opacity="0.7"/>
      <rect x="27" y="-20" width="5" height="4" rx="1" fill="#885060" opacity="0.7"/>
      <!-- Line chart -->
      <polyline points="6,-14 13,-17 20,-12 27,-15" stroke="#9c3f00" stroke-width="1.2" fill="none"/>
      <!-- Keyboard -->
      <rect x="-2" y="0" width="44" height="3" rx="1.5" fill="#4a5568"/>
    </g>
  </g>

  <!-- ======= Person 3: Field worker with clipboard (center-right) ======= -->
  <g transform="translate(530, 200)">
    <!-- Shadow -->
    <ellipse cx="18" cy="175" rx="22" ry="5" fill="#1a1512" opacity="0.06"/>
    <!-- Legs -->
    <rect x="6" y="130" width="11" height="40" rx="4" fill="#6b5c54"/>
    <rect x="23" y="130" width="11" height="40" rx="4" fill="#6b5c54"/>
    <!-- Boots (field boots) -->
    <rect x="3" y="164" width="17" height="10" rx="4" fill="#5a4030"/>
    <rect x="20" y="164" width="17" height="10" rx="4" fill="#5a4030"/>
    <!-- Body -->
    <rect x="0" y="70" width="40" height="65" rx="8" fill="#4e4e88"/>
    <!-- Vest -->
    <rect x="-2" y="72" width="44" height="35" rx="6" fill="#886850" opacity="0.8"/>
    <rect x="14" y="72" width="12" height="35" rx="2" fill="#4e4e88"/>
    <!-- Arms -->
    <!-- Right arm holding clipboard -->
    <rect x="38" y="76" width="12" height="35" rx="5" fill="#f0c5a0" transform="rotate(8,44,93)"/>
    <!-- Left arm on hip -->
    <rect x="-10" y="78" width="12" height="30" rx="5" fill="#f0c5a0" transform="rotate(-12,-4,93)"/>
    <!-- Clipboard -->
    <g transform="translate(48, 80) rotate(5)">
      <rect x="0" y="0" width="28" height="38" rx="3" fill="#f5f0e8"/>
      <rect x="0" y="0" width="28" height="38" rx="3" stroke="#c4aa82" stroke-width="1.5" fill="none"/>
      <rect x="8" y="-3" width="12" height="6" rx="2" fill="#c4aa82"/>
      <!-- Lines on clipboard -->
      <line x1="5" y1="10" x2="23" y2="10" stroke="#c4aa82" stroke-width="1.2"/>
      <line x1="5" y1="16" x2="20" y2="16" stroke="#c4aa82" stroke-width="1.2"/>
      <line x1="5" y1="22" x2="23" y2="22" stroke="#c4aa82" stroke-width="1.2"/>
      <line x1="5" y1="28" x2="16" y2="28" stroke="#c4aa82" stroke-width="1.2"/>
    </g>
    <!-- Head -->
    <circle cx="20" cy="56" r="17" fill="#e8b88a"/>
    <!-- Hair (pulled back) -->
    <path d="M3,50 Q3,34 20,32 Q37,34 37,50" fill="#6b3a1f"/>
    <!-- Ponytail -->
    <path d="M37,44 Q45,40 48,50 Q46,58 40,52" fill="#6b3a1f"/>
    <!-- Hat (field hat) -->
    <path d="M0,44 Q0,36 20,34 Q40,36 40,44" fill="#886850"/>
    <rect x="-6" y="42" width="52" height="4" rx="2" fill="#886850"/>
  </g>

  <!-- ======= Person 4: Educator/communicator (right) ======= -->
  <g transform="translate(660, 210)">
    <!-- Shadow -->
    <ellipse cx="18" cy="160" rx="22" ry="5" fill="#1a1512" opacity="0.06"/>
    <!-- Legs -->
    <rect x="8" y="115" width="10" height="40" rx="4" fill="#4a5568"/>
    <rect x="22" y="115" width="10" height="40" rx="4" fill="#4a5568"/>
    <!-- Shoes -->
    <rect x="5" y="150" width="16" height="8" rx="4" fill="#4a3728"/>
    <rect x="19" y="150" width="16" height="8" rx="4" fill="#4a3728"/>
    <!-- Body -->
    <rect x="2" y="55" width="36" height="65" rx="8" fill="#885060"/>
    <!-- Arms -->
    <!-- Right arm raised presenting -->
    <rect x="36" y="50" width="12" height="35" rx="5" fill="#f0c5a0" transform="rotate(-30,42,67)"/>
    <!-- Left arm holding document -->
    <rect x="-8" y="62" width="12" height="32" rx="5" fill="#f0c5a0" transform="rotate(10,-2,78)"/>
    <!-- Document in hand -->
    <g transform="translate(-22, 72) rotate(-8)">
      <rect x="0" y="0" width="22" height="30" rx="2" fill="white"/>
      <rect x="0" y="0" width="22" height="30" rx="2" stroke="#ddd" stroke-width="1" fill="none"/>
      <!-- Soil diagram on document -->
      <rect x="4" y="4" width="14" height="10" rx="1" fill="#d4c4a8"/>
      <rect x="4" y="4" width="14" height="4" rx="1" fill="#8B7355"/>
      <line x1="4" y1="18" x2="18" y2="18" stroke="#ccc" stroke-width="1"/>
      <line x1="4" y1="22" x2="15" y2="22" stroke="#ccc" stroke-width="1"/>
    </g>
    <!-- Head -->
    <circle cx="20" cy="42" r="16" fill="#f0c5a0"/>
    <!-- Hair (short) -->
    <path d="M4,36 Q4,22 20,20 Q36,22 36,36" fill="#c07830"/>
    <rect x="4" y="28" width="32" height="9" rx="4" fill="#c07830"/>
    <!-- Presentation pointer star -->
    <g transform="translate(58, 40)">
      <circle cx="0" cy="0" r="8" fill="#9c3f00" opacity="0.15"/>
      <path d="M0,-5 L1.5,-1.5 L5,0 L1.5,1.5 L0,5 L-1.5,1.5 L-5,0 L-1.5,-1.5 Z" fill="#9c3f00" opacity="0.6"/>
    </g>
  </g>

  <!-- ======= Floating Data Elements ======= -->
  <!-- Small chart card (top-left) -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="70" height="50" rx="8" fill="white" opacity="0.85"/>
    <rect x="0" y="0" width="70" height="50" rx="8" stroke="#9c3f00" stroke-width="1" fill="none" opacity="0.15"/>
    <!-- Mini pie chart -->
    <circle cx="25" cy="25" r="14" fill="#f0e8dc"/>
    <path d="M25,25 L25,11 A14,14 0 0,1 37,30 Z" fill="#9c3f00" opacity="0.7"/>
    <path d="M25,25 L37,30 A14,14 0 0,1 20,38 Z" fill="#586330" opacity="0.7"/>
    <!-- Legend dots -->
    <circle cx="48" cy="18" r="3" fill="#9c3f00" opacity="0.7"/>
    <line x1="54" y1="18" x2="65" y2="18" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="48" cy="28" r="3" fill="#586330" opacity="0.7"/>
    <line x1="54" y1="28" x2="62" y2="28" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="48" cy="38" r="3" fill="#4e4e88" opacity="0.5"/>
    <line x1="54" y1="38" x2="60" y2="38" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Small map pin element (top-right) -->
  <g transform="translate(700, 70)">
    <rect x="0" y="0" width="65" height="48" rx="8" fill="white" opacity="0.85"/>
    <rect x="0" y="0" width="65" height="48" rx="8" stroke="#586330" stroke-width="1" fill="none" opacity="0.15"/>
    <!-- Mini France map (simplified) -->
    <path d="M22,12 L30,8 L38,10 L42,16 L44,24 L40,32 L34,38 L28,40 L22,36 L16,30 L14,22 L18,14 Z"
          fill="#d8e6a6" opacity="0.6" stroke="#586330" stroke-width="1" opacity="0.4"/>
    <!-- Map pins -->
    <circle cx="28" cy="20" r="2.5" fill="#9c3f00"/>
    <circle cx="34" cy="28" r="2.5" fill="#586330"/>
    <circle cx="22" cy="30" r="2.5" fill="#4e4e88"/>
    <!-- Label -->
    <line x1="48" y1="18" x2="58" y2="18" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="24" x2="55" y2="24" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="30" x2="58" y2="30" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Small molecule/network element (mid-right floating) -->
  <g transform="translate(740, 160)" opacity="0.5">
    <circle cx="0" cy="0" r="6" fill="#586330" opacity="0.3"/>
    <circle cx="20" cy="-15" r="4" fill="#9c3f00" opacity="0.3"/>
    <circle cx="25" cy="10" r="5" fill="#4e4e88" opacity="0.3"/>
    <line x1="0" y1="0" x2="20" y2="-15" stroke="#586330" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="25" y2="10" stroke="#586330" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="-15" x2="25" y2="10" stroke="#586330" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Floating leaf element (bottom-left) -->
  <g transform="translate(30, 340) rotate(-15)">
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#586330" opacity="0.15"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#586330" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Small worm illustration (bottom near soil, for charm) -->
  <g transform="translate(490, 420)" opacity="0.4">
    <path d="M0,0 Q8,-6 16,-2 Q24,4 30,0" stroke="#c07830" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="0" r="2.5" fill="#c07830"/>
    <circle cx="32" cy="-1" r="1" fill="#4a3728"/>
  </g>

  <!-- ======= Decorative dots (soil particles floating) ======= -->
  <g fill="#9c3f00" opacity="0.08">
    <circle cx="180" cy="120" r="3"/>
    <circle cx="620" cy="150" r="2.5"/>
    <circle cx="380" cy="50" r="2"/>
    <circle cx="750" cy="350" r="3"/>
    <circle cx="50" cy="250" r="2"/>
    <circle cx="570" cy="80" r="2.5"/>
  </g>

</svg>
