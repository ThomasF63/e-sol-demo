<style>
  /* ============================================
     e-Sol v3 Design System
     Terra Viva Refined - Premium Edition
     ============================================ */

  :root {
    /* --- Brand Colors --- */
    --primary: #9c3f00;
    --primary-light: #c05814;
    --primary-dark: #7a3000;
    --primary-10: rgba(156, 63, 0, 0.1);
    --primary-20: rgba(156, 63, 0, 0.2);
    --secondary: #586330;
    --secondary-light: #d8e6a6;
    --secondary-10: rgba(88, 99, 48, 0.1);

    /* --- Category Semantic Colors --- */
    --cat-formation: #9c3f00;
    --cat-formation-bg: #ffdbcc;
    --cat-recherche: #586330;
    --cat-recherche-bg: #dbe9a9;
    --cat-education: #705740;
    --cat-education-bg: #fedcbe;
    --cat-professionnel: #264e54;
    --cat-professionnel-bg: #c9e2e4;
    --cat-politique: #4e4e88;
    --cat-politique-bg: #eeeef8;
    --cat-culture: #885060;
    --cat-culture-bg: #f5edf2;
    --cat-institutionnel: #8c7166;
    --cat-institutionnel-bg: #f3efec;

    /* --- Surfaces --- */
    --bg-base: #faf8f5;
    --bg-surface: #ffffff;
    --bg-elevated: rgba(255, 255, 255, 0.72);
    --bg-dark: #12100e;
    --bg-warm: #f6f3eb;
    --bg-warm-deep: #f1eee6;

    /* --- Text --- */
    --text-main: #1a1512;
    --text-muted: #6b5c54;
    --text-light: #fdfbf9;
    --text-subtle: #9a8a82;

    /* --- Borders & Shadows --- */
    --border: rgba(156, 63, 0, 0.1);
    --border-strong: rgba(156, 63, 0, 0.2);
    --border-light: rgba(255, 255, 255, 0.3);

    --radius-xs: 6px;
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 32px;
    --radius-full: 9999px;

    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 8px 24px rgba(156, 63, 0, 0.06);
    --shadow-lg: 0 16px 40px rgba(156, 63, 0, 0.08);
    --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.03);
    --shadow-card-hover: 0 20px 40px rgba(156, 63, 0, 0.1);

    /* --- Layout --- */
    --glass-blur: blur(20px);
    --font-display: 'Outfit', sans-serif;
    --font-body: 'Inter', sans-serif;
    --header-height: 72px;
    --max-width: 1200px;

    /* --- Transitions --- */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ---- Reset ---- */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    color: var(--text-main);
    background-color: var(--bg-base);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ---- Typography ---- */
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-display);
    font-weight: 700;
    line-height: 1.15;
    color: var(--text-main);
    letter-spacing: -0.025em;
  }

  h1 { font-size: clamp(2.5rem, 5vw, 4rem); }
  h2 { font-size: clamp(2rem, 4vw, 3rem); }
  h3 { font-size: clamp(1.25rem, 2.5vw, 1.75rem); }
  h4 { font-size: 1.15rem; }

  p { max-width: 72ch; }

  /* Un paragraphe centré doit l'être dans son conteneur : sans marges
     automatiques, la limite de 72ch ci-dessus cale sa boîte à gauche et le
     texte paraît décalé sur les pages larges. */
  p.text-center,
  .text-center > p,
  .section-header p,
  .footnote,
  .gov-note,
  .illustration-note,
  .cycle-note,
  .pp-note-captures {
    margin-left: auto;
    margin-right: auto;
  }

  a {
    color: var(--primary);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  a:hover { color: var(--primary-light); }

  img { max-width: 100%; height: auto; display: block; }

  ::selection {
    background: var(--primary-20);
    color: var(--text-main);
  }

  /* ---- Layout ---- */
  .container {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 24px;
    width: 100%;
  }

  .container-narrow {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 24px;
    width: 100%;
  }

  /* 12-column Bento Grid */
  .bento-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 24px;
    align-items: start;
  }

  .col-span-12 { grid-column: span 12; }
  .col-span-9  { grid-column: span 9; }
  .col-span-8  { grid-column: span 8; }
  .col-span-7  { grid-column: span 7; }
  .col-span-6  { grid-column: span 6; }
  .col-span-5  { grid-column: span 5; }
  .col-span-4  { grid-column: span 4; }
  .col-span-3  { grid-column: span 3; }

  @media (max-width: 900px) {
    .bento-grid > * { grid-column: span 12 !important; }
  }

  /* ---- Glass Card ---- */
  .glass-card {
    background: var(--bg-elevated);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-glass);
    padding: 32px;
    position: relative;
    overflow: hidden;
    transition: transform 0.5s var(--ease-out), box-shadow 0.5s var(--ease-out);
  }

  .glass-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 50%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .glass-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-card-hover);
  }

  .glass-card.no-hover:hover {
    transform: none;
    box-shadow: var(--shadow-glass);
  }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: var(--radius-full);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s var(--ease-out);
    border: none;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    white-space: nowrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    box-shadow: 0 4px 14px rgba(156, 63, 0, 0.25);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(156, 63, 0, 0.35);
    color: white;
  }

  .btn-secondary {
    background: linear-gradient(135deg, var(--secondary), #6e7a3d);
    color: white;
    box-shadow: 0 4px 14px rgba(88, 99, 48, 0.2);
  }
  .btn-secondary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(88, 99, 48, 0.3);
    color: white;
  }

  .btn-outline {
    background: var(--bg-surface);
    border: 1.5px solid var(--border-strong);
    color: var(--text-main);
  }
  .btn-outline:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--bg-surface);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-main);
    padding: 8px 16px;
  }
  .btn-ghost:hover {
    background: var(--primary-10);
    color: var(--primary);
  }

  .btn-sm { padding: 8px 16px; font-size: 13px; }
  .btn-lg { padding: 16px 32px; font-size: 16px; }
  .btn-icon { padding: 10px; min-width: 40px; }

  /* ---- Badges ---- */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 5px 14px;
    border-radius: var(--radius-full);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    line-height: 1.4;
  }

  .badge-terra {
    background: var(--primary-10);
    color: var(--primary);
    border: 1px solid var(--primary-20);
  }

  .badge-olive {
    background: var(--secondary-10);
    color: var(--secondary);
    border: 1px solid rgba(88, 99, 48, 0.2);
  }

  .badge-neutral {
    background: rgba(0,0,0,0.04);
    color: var(--text-muted);
    border: 1px solid rgba(0,0,0,0.06);
  }

  /* ---- Section helpers ---- */
  .section { padding: 80px 0; }
  .section-alt { background: var(--bg-warm); }
  .section-sm { padding: 48px 0; }

  .section-header {
    text-align: center;
    margin-bottom: 56px;
  }
  .section-header p {
    color: var(--text-muted);
    font-size: 1.15rem;
    max-width: 600px;
    margin: 16px auto 0;
  }

  .page-hero {
    padding: calc(var(--header-height) + 64px) 0 64px;
    text-align: center;
    background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-base) 100%);
    border-bottom: 1px solid var(--border);
  }
  .page-hero p {
    max-width: 640px;
    margin: 16px auto 0;
    font-size: 1.15rem;
    color: var(--text-muted);
  }

  /* ---- Utility ---- */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .flex-wrap { flex-wrap: wrap; }
  .items-center { align-items: center; }
  .items-start { align-items: flex-start; }
  .items-stretch { align-items: stretch; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .gap-1 { gap: 0.25rem; }
  .gap-2 { gap: 0.5rem; }
  .gap-3 { gap: 0.75rem; }
  .gap-4 { gap: 1rem; }
  .gap-6 { gap: 1.5rem; }
  .gap-8 { gap: 2rem; }
  .w-full { width: 100%; }

  .text-center { text-align: center; }
  .text-muted { color: var(--text-muted); }
  .text-subtle { color: var(--text-subtle); }
  .text-sm { font-size: 0.875rem; }
  .text-xs { font-size: 0.75rem; }
  .text-lg { font-size: 1.125rem; }

  .mt-1 { margin-top: 0.25rem; }
  .mt-2 { margin-top: 0.5rem; }
  .mt-3 { margin-top: 1rem; }
  .mt-4 { margin-top: 1.5rem; }
  .mt-6 { margin-top: 2rem; }
  .mt-8 { margin-top: 3rem; }
  .mb-1 { margin-bottom: 0.25rem; }
  .mb-2 { margin-bottom: 0.5rem; }
  .mb-3 { margin-bottom: 1rem; }
  .mb-4 { margin-bottom: 1.5rem; }
  .mb-6 { margin-bottom: 2rem; }
  .mb-8 { margin-bottom: 3rem; }
  .mb-12 { margin-bottom: 5rem; }
  .py-8 { padding-top: 4rem; padding-bottom: 4rem; }
  .py-12 { padding-top: 6rem; padding-bottom: 6rem; }

  .font-display { font-family: var(--font-display); }
  .font-semibold { font-weight: 600; }
  .font-bold { font-weight: 700; }

  .bg-surface { background: var(--bg-surface); }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); border: 0;
  }

  /* ---- Animations ---- */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-in {
    animation: fadeInUp 0.6s var(--ease-out) forwards;
    opacity: 0;
  }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.3s; }
  .delay-4 { animation-delay: 0.4s; }

  /* ---- Divider ---- */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 32px 0;
    border: none;
  }

  /* ---- Scrollbar styling ---- */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
</style>
