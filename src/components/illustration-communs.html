<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none" role="img" aria-label="Illustration communs partagés">
  <!-- Background -->
  <circle cx="140" cy="115" r="90" fill="#586330" opacity="0.04"/>

  <!-- Shared table / surface -->
  <rect x="50" y="120" width="180" height="8" rx="4" fill="#c4aa82"/>
  <rect x="70" y="128" width="6" height="35" rx="2" fill="#b09570"/>
  <rect x="204" y="128" width="6" height="35" rx="2" fill="#b09570"/>
  <ellipse cx="140" cy="165" rx="80" ry="6" fill="#1a1512" opacity="0.04"/>

  <!-- Shared resources on table -->
  <!-- Book/guide -->
  <g transform="translate(65, 95)">
    <rect x="0" y="0" width="35" height="26" rx="3" fill="#586330"/>
    <rect x="3" y="3" width="29" height="20" rx="2" fill="#d8e6a6"/>
    <line x1="8" y1="10" x2="28" y2="10" stroke="#586330" stroke-width="1" opacity="0.4"/>
    <line x1="8" y1="14" x2="24" y2="14" stroke="#586330" stroke-width="1" opacity="0.3"/>
    <line x1="8" y1="18" x2="26" y2="18" stroke="#586330" stroke-width="1" opacity="0.3"/>
    <!-- Soil icon on cover -->
    <rect x="10" y="5" width="8" height="4" rx="1" fill="#8B7355" opacity="0.6"/>
  </g>

  <!-- Map/cartography -->
  <g transform="translate(115, 88)">
    <rect x="0" y="0" width="50" height="34" rx="3" fill="#f5f0e8"/>
    <rect x="0" y="0" width="50" height="34" rx="3" stroke="#c4aa82" stroke-width="1" fill="none"/>
    <!-- Terrain lines -->
    <path d="M8,10 Q15,6 22,12 Q30,18 38,10 Q42,7 45,10" stroke="#586330" stroke-width="1.2" fill="none" opacity="0.4"/>
    <path d="M5,16 Q12,12 20,18 Q28,24 35,16 Q40,12 48,17" stroke="#9c3f00" stroke-width="1.2" fill="none" opacity="0.3"/>
    <path d="M8,22 Q18,18 25,22 Q32,26 42,22" stroke="#4e4e88" stroke-width="1" fill="none" opacity="0.25"/>
    <!-- Map pins -->
    <circle cx="18" cy="14" r="2.5" fill="#9c3f00" opacity="0.6"/>
    <circle cx="35" cy="12" r="2.5" fill="#586330" opacity="0.6"/>
    <circle cx="28" cy="22" r="2" fill="#4e4e88" opacity="0.5"/>
  </g>

  <!-- Toolkit/box -->
  <g transform="translate(175, 97)">
    <rect x="0" y="5" width="38" height="22" rx="3" fill="#9c3f00" opacity="0.8"/>
    <rect x="2" y="7" width="34" height="18" rx="2" fill="#c05814" opacity="0.3"/>
    <rect x="-2" y="2" width="42" height="6" rx="3" fill="#9c3f00"/>
    <rect x="12" y="0" width="14" height="4" rx="2" fill="#7a3000"/>
    <!-- Tools peeking out -->
    <rect x="8" y="-5" width="3" height="10" rx="1" fill="#c4aa82" transform="rotate(-10,9.5,0)"/>
    <rect x="22" y="-8" width="3" height="12" rx="1" fill="#c4aa82" transform="rotate(8,23.5,-2)"/>
  </g>

  <!-- Person 1 (left, handing resource) -->
  <g transform="translate(40, 58)">
    <circle cx="14" cy="0" r="12" fill="#f0c5a0"/>
    <path d="M2,-4 Q2,-14 14,-16 Q26,-14 26,-4" fill="#4a3728"/>
    <rect x="3" y="13" width="22" height="32" rx="5" fill="#586330"/>
    <!-- Right arm extended (sharing) -->
    <rect x="22" y="18" width="10" height="28" rx="4" fill="#f0c5a0" transform="rotate(25,27,32)"/>
    <!-- Left arm -->
    <rect x="-6" y="20" width="10" height="22" rx="4" fill="#f0c5a0" transform="rotate(-10,-1,31)"/>
    <rect x="5" y="46" width="8" height="26" rx="3.5" fill="#3d3d5c"/>
    <rect x="15" y="46" width="8" height="26" rx="3.5" fill="#3d3d5c"/>
  </g>

  <!-- Person 2 (right, receiving) -->
  <g transform="translate(205, 55)">
    <circle cx="14" cy="0" r="12" fill="#d4a574"/>
    <path d="M2,-4 Q2,-14 14,-16 Q26,-14 26,-4" fill="#3d2b1f"/>
    <circle cx="8" cy="-8" r="4.5" fill="#3d2b1f"/>
    <circle cx="14" cy="-11" r="4.5" fill="#3d2b1f"/>
    <circle cx="20" cy="-8" r="4.5" fill="#3d2b1f"/>
    <rect x="3" y="13" width="22" height="32" rx="5" fill="#885060"/>
    <!-- Left arm extended (receiving) -->
    <rect x="-6" y="18" width="10" height="28" rx="4" fill="#d4a574" transform="rotate(-25,0,32)"/>
    <!-- Right arm -->
    <rect x="22" y="20" width="10" height="22" rx="4" fill="#d4a574" transform="rotate(10,27,31)"/>
    <rect x="5" y="46" width="8" height="26" rx="3.5" fill="#4a5568"/>
    <rect x="15" y="46" width="8" height="26" rx="3.5" fill="#4a5568"/>
  </g>

  <!-- Sharing arrows -->
  <g stroke="#586330" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M80,80 Q110,70 130,78" marker-end="url(#arrowG)"/>
    <path d="M200,78 Q175,68 155,76" marker-end="url(#arrowG)"/>
  </g>
  <defs>
    <marker id="arrowG" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#586330" opacity="0.4"/>
    </marker>
  </defs>

  <!-- Floating shared icons -->
  <g opacity="0.15">
    <circle cx="30" cy="40" r="3" fill="#586330"/>
    <circle cx="250" cy="35" r="3.5" fill="#9c3f00"/>
    <circle cx="255" cy="150" r="2.5" fill="#4e4e88"/>
    <circle cx="25" cy="155" r="3" fill="#885060"/>
  </g>

  <!-- Heart symbol (sharing/commons) -->
  <g transform="translate(132, 70)" opacity="0.2">
    <path d="M8,5 Q8,0 4,0 Q0,0 0,4 Q0,8 8,14 Q16,8 16,4 Q16,0 12,0 Q8,0 8,5 Z" fill="#9c3f00"/>
  </g>
</svg>
