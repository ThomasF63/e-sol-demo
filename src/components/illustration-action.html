<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none" role="img" aria-label="Illustration passer à l'action">
  <!-- Background -->
  <circle cx="140" cy="110" r="90" fill="#4e4e88" opacity="0.035"/>

  <!-- Ground/terrain -->
  <path d="M0,185 Q70,175 140,180 Q210,185 280,178 L280,220 L0,220 Z" fill="#d4c4a8" opacity="0.25"/>
  <path d="M0,190 Q70,182 140,186 Q210,190 280,184 L280,220 L0,220 Z" fill="#8B7355" opacity="0.12"/>

  <!-- Person planting (center, main action) -->
  <g transform="translate(115, 85)">
    <!-- Shadow -->
    <ellipse cx="25" cy="115" rx="28" ry="5" fill="#1a1512" opacity="0.05"/>
    <!-- Legs (kneeling pose) -->
    <rect x="10" y="80" width="10" height="30" rx="4" fill="#6b5c54" transform="rotate(15,15,95)"/>
    <rect x="28" y="75" width="10" height="28" rx="4" fill="#6b5c54" transform="rotate(-30,33,89)"/>
    <!-- Boots -->
    <rect x="5" y="106" width="16" height="8" rx="3.5" fill="#5a4030" transform="rotate(10,13,110)"/>
    <rect x="38" y="95" width="16" height="8" rx="3.5" fill="#5a4030" transform="rotate(-20,46,99)"/>
    <!-- Body (leaning forward) -->
    <rect x="10" y="35" width="32" height="48" rx="7" fill="#586330" transform="rotate(5,26,59)"/>
    <!-- Arms (digging/planting) -->
    <rect x="38" y="42" width="10" height="35" rx="4" fill="#f0c5a0" transform="rotate(30,43,59)"/>
    <rect x="0" y="44" width="10" height="30" rx="4" fill="#f0c5a0" transform="rotate(-20,5,59)"/>
    <!-- Hands -->
    <circle cx="52" cy="72" r="5" fill="#f0c5a0"/>
    <circle cx="-6" cy="68" r="5" fill="#f0c5a0"/>
    <!-- Head -->
    <circle cx="26" cy="22" r="15" fill="#e8b88a"/>
    <!-- Hair -->
    <path d="M11,16 Q11,4 26,2 Q41,4 41,16" fill="#6b3a1f"/>
    <!-- Cap -->
    <path d="M9,16 Q9,8 26,6 Q43,8 43,16" fill="#586330"/>
    <rect x="6" y="14" width="40" height="4" rx="2" fill="#586330"/>

    <!-- Small seedling being planted -->
    <g transform="translate(48, 65)">
      <rect x="-1" y="0" width="3" height="12" rx="1" fill="#6d7a45"/>
      <ellipse cx="-6" cy="-2" rx="8" ry="4" fill="#586330" transform="rotate(-30,-6,-2)"/>
      <ellipse cx="7" cy="-4" rx="7" ry="3.5" fill="#6d8035" transform="rotate(25,7,-4)"/>
      <!-- Soil mound -->
      <ellipse cx="0" cy="12" rx="14" ry="5" fill="#8B7355" opacity="0.6"/>
    </g>
  </g>

  <!-- Person with watering can (left) -->
  <g transform="translate(30, 95)">
    <ellipse cx="16" cy="110" rx="18" ry="4" fill="#1a1512" opacity="0.04"/>
    <circle cx="16" cy="0" r="12" fill="#f0c5a0"/>
    <path d="M4,-4 Q4,-14 16,-16 Q28,-14 28,-4" fill="#c07830"/>
    <rect x="5" y="13" width="22" height="35" rx="5" fill="#9c3f00"/>
    <!-- Left arm holding watering can -->
    <rect x="-6" y="18" width="10" height="28" rx="4" fill="#f0c5a0" transform="rotate(-20,-1,32)"/>
    <!-- Right arm on can -->
    <rect x="24" y="22" width="10" height="24" rx="4" fill="#f0c5a0" transform="rotate(15,29,34)"/>
    <rect x="6" y="49" width="9" height="28" rx="3.5" fill="#4a5568"/>
    <rect x="17" y="49" width="9" height="28" rx="3.5" fill="#4a5568"/>
    <!-- Watering can -->
    <g transform="translate(-18, 38)">
      <rect x="0" y="0" width="22" height="16" rx="4" fill="#8c7166"/>
      <rect x="0" y="0" width="22" height="16" rx="4" fill="#a08562" opacity="0.5"/>
      <rect x="7" y="-6" width="8" height="8" rx="2" fill="#8c7166"/>
      <line x1="22" y1="4" x2="32" y2="-4" stroke="#8c7166" stroke-width="3" stroke-linecap="round"/>
      <!-- Water drops -->
      <circle cx="34" cy="0" r="2" fill="#7ab8d4" opacity="0.5"/>
      <circle cx="30" cy="4" r="1.5" fill="#7ab8d4" opacity="0.4"/>
      <circle cx="36" cy="5" r="1.5" fill="#7ab8d4" opacity="0.3"/>
    </g>
  </g>

  <!-- Person with sign/flag (right, advocacy) -->
  <g transform="translate(210, 80)">
    <ellipse cx="16" cy="125" rx="18" ry="4" fill="#1a1512" opacity="0.04"/>
    <circle cx="16" cy="0" r="12" fill="#d4a574"/>
    <path d="M4,-4 Q4,-14 16,-16 Q28,-14 28,-4" fill="#3d2b1f"/>
    <rect x="5" y="13" width="22" height="35" rx="5" fill="#4e4e88"/>
    <!-- Right arm holding flag pole -->
    <rect x="24" y="15" width="10" height="30" rx="4" fill="#d4a574" transform="rotate(5,29,30)"/>
    <!-- Left arm -->
    <rect x="-6" y="20" width="10" height="24" rx="4" fill="#d4a574" transform="rotate(-8,-1,32)"/>
    <rect x="6" y="49" width="9" height="28" rx="3.5" fill="#3d3d5c"/>
    <rect x="17" y="49" width="9" height="28" rx="3.5" fill="#3d3d5c"/>
    <!-- Flag/sign -->
    <g transform="translate(32, -20)">
      <rect x="0" y="0" width="3" height="65" rx="1.5" fill="#8c7166"/>
      <rect x="3" y="2" width="35" height="24" rx="4" fill="#9c3f00" opacity="0.85"/>
      <rect x="3" y="2" width="35" height="24" rx="4" stroke="#7a3000" stroke-width="1" fill="none" opacity="0.3"/>
      <!-- Soil/plant icon on flag -->
      <circle cx="13" cy="14" r="5" fill="#fff" opacity="0.25"/>
      <rect x="20" y="10" width="12" height="2" rx="1" fill="#fff" opacity="0.3"/>
      <rect x="20" y="15" width="9" height="2" rx="1" fill="#fff" opacity="0.2"/>
    </g>
  </g>

  <!-- Growing plants along bottom -->
  <g opacity="0.5">
    <!-- Plant 1 -->
    <g transform="translate(80, 175)">
      <rect x="-1" y="-18" width="2.5" height="18" rx="1" fill="#586330"/>
      <ellipse cx="-6" cy="-20" rx="7" ry="3.5" fill="#6d8035" transform="rotate(-25,-6,-20)"/>
      <ellipse cx="6" cy="-22" rx="6" ry="3" fill="#586330" transform="rotate(20,6,-22)"/>
    </g>
    <!-- Plant 2 -->
    <g transform="translate(180, 178)">
      <rect x="-1" y="-14" width="2" height="14" rx="1" fill="#586330"/>
      <ellipse cx="-5" cy="-16" rx="6" ry="3" fill="#6d8035" transform="rotate(-20,-5,-16)"/>
      <ellipse cx="5" cy="-17" rx="5" ry="2.5" fill="#7a9040" transform="rotate(25,5,-17)"/>
    </g>
    <!-- Plant 3 (small sprout) -->
    <g transform="translate(240, 180)">
      <rect x="0" y="-10" width="2" height="10" rx="1" fill="#586330"/>
      <ellipse cx="-3" cy="-11" rx="5" ry="2.5" fill="#6d8035" transform="rotate(-30,-3,-11)"/>
      <ellipse cx="4" cy="-12" rx="4" ry="2" fill="#7a9040" transform="rotate(20,4,-12)"/>
    </g>
  </g>

  <!-- Floating elements -->
  <g opacity="0.12">
    <circle cx="260" cy="40" r="3.5" fill="#586330"/>
    <circle cx="20" cy="50" r="3" fill="#9c3f00"/>
    <circle cx="265" cy="150" r="2.5" fill="#4e4e88"/>
  </g>

  <!-- Sparkle/star (energy, action) -->
  <g transform="translate(140, 30)" opacity="0.2">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#9c3f00"/>
  </g>
  <g transform="translate(85, 50)" opacity="0.12">
    <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" fill="#586330"/>
  </g>
</svg>
