<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" fill="none" role="img" aria-label="Les cinq niveaux de participation à e-Sol, représentés comme un escalier : 1 visiteur·euse non inscrit·e, 2 membre inscrit·e, 3 membre d'une communauté, 4 animateur·rice de communauté, 5 administrateur·rice de la plateforme. Chaque niveau conserve tous les droits du précédent. L'escalier repose sur le sol du village : la charte s'applique à tous les niveaux.">

  <!-- ============================================
       Background atmosphere
       ============================================ -->
  <circle cx="150" cy="160" r="140" fill="#9c3f00" opacity="0.03"/>
  <circle cx="760" cy="430" r="180" fill="#586330" opacity="0.04"/>
  <circle cx="460" cy="100" r="80" fill="#c05814" opacity="0.045"/>

  <!-- Soft ascending arrow (cumulative rights, drawn behind) -->
  <g opacity="0.07">
    <path d="M95,485 L760,143" stroke="#9c3f00" stroke-width="12" stroke-linecap="round"/>
    <polygon points="792,127 765,158 751,131" fill="#9c3f00"/>
  </g>

  <!-- ============================================
       Title (kept in the SVG so the PNG export
       stays self-sufficient on the wiki)
       ============================================ -->
  <text x="450" y="34" font-family="Outfit, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#9c3f00" letter-spacing="2">LES CINQ NIVEAUX DE PARTICIPATION</text>
  <text x="450" y="52" font-family="Inter, sans-serif" font-size="10.5" text-anchor="middle" fill="#6b5c54">Chaque niveau conserve tous les droits du précédent : les droits s'additionnent.</text>

  <!-- ============================================
       STEP 1 : visiteur·euse non inscrit·e
       ============================================ -->
  <g>
    <rect x="75" y="432" width="150" height="88" fill="#f3efec" stroke="#8c7166" stroke-width="2"/>
    <rect x="75" y="432" width="150" height="5" fill="#8c7166" opacity="0.35"/>
    <circle cx="95" cy="454" r="11" fill="#8c7166"/>
    <text x="95" y="458" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fdfbf9">1</text>
    <text x="113" y="451" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#5a4a42">Visiteur·euse</text>
    <text x="113" y="463" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#5a4a42">non inscrit·e</text>
    <text x="87" y="482" font-family="Inter, sans-serif" font-size="9" fill="#4a3f38">pages publiques et annuaire</text>
    <text x="87" y="495" font-family="Inter, sans-serif" font-size="9" fill="#4a3f38">lire le forum</text>
    <text x="87" y="508" font-family="Inter, sans-serif" font-size="9" fill="#4a3f38">s'inscrire</text>
  </g>

  <!-- Figure 1 : simple visitor with curiosity badge -->
  <g transform="translate(150, 432)">
    <ellipse cx="0" cy="2" rx="16" ry="3.5" fill="#1a1512" opacity="0.08"/>
    <rect x="-8.5" y="-27" width="7.5" height="27" rx="3" fill="#6b5c54"/>
    <rect x="1" y="-27" width="7.5" height="27" rx="3" fill="#6b5c54"/>
    <rect x="-11" y="-50" width="22" height="26" rx="5" fill="#8c7166"/>
    <circle cx="0" cy="-58" r="8" fill="#f0c5a0"/>
    <path d="M-8,-61 Q-8,-68 0,-69 Q8,-68 8,-61" fill="#4a3728"/>
    <circle cx="16" cy="-44" r="5.5" fill="#c05814" opacity="0.9"/>
    <text x="16" y="-41" font-family="Outfit, sans-serif" font-size="8" font-weight="700" text-anchor="middle" fill="#fdfbf9">?</text>
  </g>

  <!-- Transition 1 -> 2 -->
  <g transform="translate(225, 432)">
    <path d="M-18,-12 Q0,-46 14,-70" stroke="#9c3f00" stroke-width="1.8" fill="none" opacity="0.65"/>
    <polygon points="14,-70 12.9,-60.3 6.1,-64.3" fill="#9c3f00" opacity="0.65"/>
    <text x="-8" y="-76" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" text-anchor="end" fill="#6b5c54">s'inscrire</text>
  </g>

  <!-- ============================================
       STEP 2 : membre inscrit·e
       ============================================ -->
  <g>
    <rect x="225" y="362" width="150" height="158" fill="#eeeef8" stroke="#4e4e88" stroke-width="2"/>
    <rect x="225" y="362" width="150" height="5" fill="#4e4e88" opacity="0.35"/>
    <circle cx="245" cy="384" r="11" fill="#4e4e88"/>
    <text x="245" y="388" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fdfbf9">2</text>
    <text x="263" y="381" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#3d3d5c">Membre</text>
    <text x="263" y="393" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#3d3d5c">inscrit·e</text>
    <text x="237" y="412" font-family="Inter, sans-serif" font-size="9" fill="#3d3d5c">+ sa fiche dans l'annuaire</text>
    <text x="237" y="425" font-family="Inter, sans-serif" font-size="9" fill="#3d3d5c">+ commenter</text>
    <text x="237" y="438" font-family="Inter, sans-serif" font-size="9" fill="#3d3d5c">+ fiches action, annonces</text>
    <text x="237" y="451" font-family="Inter, sans-serif" font-size="9" fill="#3d3d5c">+ rejoindre une communauté</text>
  </g>

  <!-- Figure 2 : holds their directory card -->
  <g transform="translate(300, 362)">
    <ellipse cx="0" cy="2" rx="16" ry="3.5" fill="#1a1512" opacity="0.08"/>
    <rect x="-8.5" y="-27" width="7.5" height="27" rx="3" fill="#3d3d5c"/>
    <rect x="1" y="-27" width="7.5" height="27" rx="3" fill="#3d3d5c"/>
    <rect x="-11" y="-50" width="22" height="26" rx="5" fill="#4e4e88"/>
    <rect x="-19" y="-42" width="7" height="16" rx="3" fill="#d4a574" transform="rotate(18,-15.5,-34)"/>
    <circle cx="0" cy="-58" r="8" fill="#d4a574"/>
    <path d="M-8,-61 Q-8,-68 0,-69 Q8,-68 8,-61" fill="#6b3a1f"/>
    <!-- Directory card -->
    <rect x="-28" y="-34" width="14" height="11" rx="1.5" fill="#fdfbf9" stroke="#4e4e88" stroke-width="1"/>
    <circle cx="-24.5" cy="-30.5" r="1.6" fill="#4e4e88" opacity="0.7"/>
    <line x1="-21.5" y1="-31" x2="-16.5" y2="-31" stroke="#4e4e88" stroke-width="0.9" opacity="0.7"/>
    <line x1="-25.5" y1="-26.5" x2="-16.5" y2="-26.5" stroke="#4e4e88" stroke-width="0.9" opacity="0.7"/>
  </g>

  <!-- Transition 2 -> 3 -->
  <g transform="translate(375, 362)">
    <path d="M-18,-12 Q0,-46 14,-70" stroke="#9c3f00" stroke-width="1.8" fill="none" opacity="0.65"/>
    <polygon points="14,-70 12.9,-60.3 6.1,-64.3" fill="#9c3f00" opacity="0.65"/>
    <text x="-8" y="-76" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" text-anchor="end" fill="#6b5c54">rejoindre</text>
  </g>

  <!-- ============================================
       STEP 3 : membre d'une communauté
       ============================================ -->
  <g>
    <rect x="375" y="292" width="150" height="228" fill="#ffdbcc" stroke="#9c3f00" stroke-width="2"/>
    <rect x="375" y="292" width="150" height="5" fill="#9c3f00" opacity="0.35"/>
    <circle cx="395" cy="314" r="11" fill="#9c3f00"/>
    <text x="395" y="318" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fdfbf9">3</text>
    <text x="413" y="311" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#7a3000">Membre d'une</text>
    <text x="413" y="323" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#7a3000">communauté</text>
    <text x="387" y="342" font-family="Inter, sans-serif" font-size="9" fill="#7a3000">+ espaces de sa communauté</text>
    <text x="387" y="355" font-family="Inter, sans-serif" font-size="9" fill="#7a3000">+ documents, discussions</text>
    <text x="387" y="368" font-family="Inter, sans-serif" font-size="9" fill="#7a3000">+ cercle restreint,</text>
    <text x="395" y="381" font-family="Inter, sans-serif" font-size="9" fill="#7a3000">si la communauté l'active *</text>
  </g>

  <!-- Figures 3 : two members together -->
  <g transform="translate(437, 292)">
    <ellipse cx="0" cy="2" rx="26" ry="4" fill="#1a1512" opacity="0.08"/>
    <g transform="translate(-14, 0)">
      <rect x="-8" y="-25" width="7" height="25" rx="3" fill="#6b5c54"/>
      <rect x="1" y="-25" width="7" height="25" rx="3" fill="#6b5c54"/>
      <rect x="-10.5" y="-47" width="21" height="25" rx="5" fill="#9c3f00"/>
      <circle cx="0" cy="-55" r="7.5" fill="#f0c5a0"/>
      <path d="M-7.5,-58 Q-7.5,-65 0,-66 Q7.5,-65 7.5,-58" fill="#4a3728"/>
    </g>
    <g transform="translate(15, 0)">
      <rect x="-7.5" y="-23" width="6.5" height="23" rx="3" fill="#4a5568"/>
      <rect x="1" y="-23" width="6.5" height="23" rx="3" fill="#4a5568"/>
      <rect x="-10" y="-44" width="20" height="24" rx="5" fill="#885060"/>
      <circle cx="0" cy="-51.5" r="7" fill="#d4a574"/>
      <path d="M-7,-54 Q-7,-61 0,-62 Q7,-61 7,-54" fill="#3d2b1f"/>
    </g>
  </g>

  <!-- Transition 3 -> 4 (framework to be defined: proposal) -->
  <g transform="translate(525, 292)">
    <path d="M-18,-12 Q0,-46 14,-70" stroke="#9c3f00" stroke-width="1.8" fill="none" opacity="0.65" stroke-dasharray="4 3"/>
    <polygon points="14,-70 12.9,-60.3 6.1,-64.3" fill="#9c3f00" opacity="0.65"/>
    <text x="-8" y="-76" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" text-anchor="end" fill="#6b5c54">animer *</text>
  </g>

  <!-- ============================================
       STEP 4 : animateur·rice de communauté
       ============================================ -->
  <g>
    <rect x="525" y="222" width="150" height="298" fill="#dbe9a9" stroke="#586330" stroke-width="2"/>
    <rect x="525" y="222" width="150" height="5" fill="#586330" opacity="0.35"/>
    <circle cx="545" cy="244" r="11" fill="#586330"/>
    <text x="545" y="248" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fdfbf9">4</text>
    <text x="563" y="241" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#3d4d1f">Animateur·rice</text>
    <text x="563" y="253" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#3d4d1f">de communauté</text>
    <text x="537" y="272" font-family="Inter, sans-serif" font-size="9" fill="#3d4d1f">+ accueillir les nouveaux</text>
    <text x="537" y="285" font-family="Inter, sans-serif" font-size="9" fill="#3d4d1f">+ valider les adhésions</text>
    <text x="537" y="298" font-family="Inter, sans-serif" font-size="9" fill="#3d4d1f">+ éditer les pages</text>
    <text x="537" y="311" font-family="Inter, sans-serif" font-size="9" fill="#3d4d1f">+ modérer son périmètre</text>
    <text x="537" y="324" font-family="Inter, sans-serif" font-size="9" fill="#3d4d1f">+ activer ou non le cercle *</text>
  </g>

  <!-- Figure 4 : carries the community pennant -->
  <g transform="translate(600, 222)">
    <ellipse cx="0" cy="2" rx="16" ry="3.5" fill="#1a1512" opacity="0.08"/>
    <rect x="-8.5" y="-27" width="7.5" height="27" rx="3" fill="#3d4d1f"/>
    <rect x="1" y="-27" width="7.5" height="27" rx="3" fill="#3d4d1f"/>
    <rect x="-11" y="-50" width="22" height="26" rx="5" fill="#586330"/>
    <rect x="8" y="-44" width="7" height="16" rx="3" fill="#f0c5a0" transform="rotate(-20,11.5,-36)"/>
    <circle cx="0" cy="-58" r="8" fill="#f0c5a0"/>
    <path d="M-8,-61 Q-8,-68 0,-69 Q8,-68 8,-61" fill="#6b3a1f"/>
    <!-- Pennant -->
    <line x1="17" y1="-62" x2="17" y2="-32" stroke="#705740" stroke-width="2"/>
    <polygon points="17,-62 34,-56 17,-50" fill="#c05814"/>
  </g>

  <!-- Transition 4 -> 5 (designation: proposal) -->
  <g transform="translate(675, 222)">
    <path d="M-18,-12 Q0,-46 14,-70" stroke="#9c3f00" stroke-width="1.8" fill="none" opacity="0.65" stroke-dasharray="4 3"/>
    <polygon points="14,-70 12.9,-60.3 6.1,-64.3" fill="#9c3f00" opacity="0.65"/>
    <text x="-8" y="-76" font-family="Inter, sans-serif" font-size="8.5" font-weight="600" text-anchor="end" fill="#6b5c54">désignation *</text>
  </g>

  <!-- ============================================
       STEP 5 : administrateur·rice de la plateforme
       ============================================ -->
  <g>
    <rect x="675" y="152" width="150" height="368" fill="#9c3f00" stroke="#7a3000" stroke-width="2"/>
    <rect x="675" y="152" width="150" height="5" fill="#7a3000" opacity="0.6"/>
    <circle cx="695" cy="174" r="11" fill="#fdfbf9"/>
    <text x="695" y="178" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#9c3f00">5</text>
    <text x="713" y="171" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#fdfbf9">Administrateur·rice</text>
    <text x="713" y="183" font-family="Outfit, sans-serif" font-size="10.5" font-weight="600" fill="#fdfbf9">de la plateforme</text>
    <text x="687" y="202" font-family="Inter, sans-serif" font-size="9" fill="#ffdbcc">+ comptes et groupes</text>
    <text x="687" y="215" font-family="Inter, sans-serif" font-size="9" fill="#ffdbcc">+ droits d'accès des pages</text>
    <text x="687" y="228" font-family="Inter, sans-serif" font-size="9" fill="#ffdbcc">+ formulaires et statuts</text>
    <text x="687" y="241" font-family="Inter, sans-serif" font-size="9" fill="#ffdbcc">+ tout éditer ou supprimer</text>
  </g>

  <!-- Figure 5 : holds the keys of the house -->
  <g transform="translate(750, 152)">
    <ellipse cx="0" cy="2" rx="16" ry="3.5" fill="#1a1512" opacity="0.18"/>
    <rect x="-8.5" y="-27" width="7.5" height="27" rx="3" fill="#8c7166"/>
    <rect x="1" y="-27" width="7.5" height="27" rx="3" fill="#8c7166"/>
    <rect x="-11" y="-50" width="22" height="26" rx="5" fill="#f5ede0"/>
    <rect x="8" y="-44" width="7" height="16" rx="3" fill="#d4a574" transform="rotate(-20,11.5,-36)"/>
    <circle cx="0" cy="-58" r="8" fill="#d4a574"/>
    <path d="M-8,-61 Q-8,-68 0,-69 Q8,-68 8,-61" fill="#3d2b1f"/>
    <!-- Key -->
    <circle cx="18" cy="-36" r="4" stroke="#fdfbf9" stroke-width="2" fill="none"/>
    <line x1="18" y1="-32" x2="18" y2="-20" stroke="#fdfbf9" stroke-width="2"/>
    <line x1="18" y1="-24" x2="22" y2="-24" stroke="#fdfbf9" stroke-width="2"/>
    <line x1="18" y1="-20" x2="22" y2="-20" stroke="#fdfbf9" stroke-width="2"/>
  </g>

  <!-- ============================================
       Ground band (the charter under everything)
       ============================================ -->
  <rect x="0" y="520" width="900" height="34" fill="#6b5c54"/>
  <rect x="0" y="554" width="900" height="6" fill="#5a4836"/>
  <g stroke="#4a3728" stroke-width="0.8" opacity="0.5">
    <line x1="130" y1="526" x2="130" y2="548"/>
    <line x1="260" y1="526" x2="260" y2="548"/>
    <line x1="390" y1="526" x2="390" y2="548"/>
    <line x1="520" y1="526" x2="520" y2="548"/>
    <line x1="650" y1="526" x2="650" y2="548"/>
    <line x1="780" y1="526" x2="780" y2="548"/>
  </g>
  <text x="450" y="541" font-family="Outfit, sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#fdfbf9" letter-spacing="1.5">LE SOL DU VILLAGE - LA CHARTE S'APPLIQUE À TOUS LES NIVEAUX</text>

  <!-- Legend -->
  <text x="75" y="582" font-family="Inter, sans-serif" font-size="9.5" fill="#6b5c54">* proposition, à valider - source : référentiel des rôles et droits e-Sol</text>
  <text x="825" y="582" font-family="Inter, sans-serif" font-size="9.5" text-anchor="end" fill="#6b5c54">niveaux cumulatifs : 1 à 5</text>

  <!-- Floating decorative soil particles -->
  <g fill="#9c3f00" opacity="0.1">
    <circle cx="60" cy="120" r="3"/>
    <circle cx="330" cy="90" r="2.5"/>
    <circle cx="860" cy="100" r="3"/>
    <circle cx="40" cy="330" r="2.5"/>
    <circle cx="620" cy="80" r="2"/>
  </g>

</svg>
