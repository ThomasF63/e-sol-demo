<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" fill="none" role="img" aria-label="Illustration premiers pas — cinq jalons à franchir pour s'installer dans la maison e-Sol">

  <!-- Background -->
  <circle cx="120" cy="200" r="160" fill="#9c3f00" opacity="0.035"/>
  <circle cx="600" cy="80" r="140" fill="#586330" opacity="0.045"/>

  <!-- Horizontal soil line / path -->
  <g opacity="0.5">
    <line x1="60" y1="170" x2="660" y2="170" stroke="#c4aa82" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="170" x2="660" y2="170" stroke="#a08562" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 14" opacity="0.5"/>
  </g>

  <!-- ============ Step 1: Profil ============ -->
  <g transform="translate(110, 170)">
    <!-- Circle marker -->
    <circle cx="0" cy="0" r="22" fill="#9c3f00"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fdfbf9" stroke-width="3"/>
    <text x="0" y="5" font-family="Outfit, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#fdfbf9">1</text>
    <!-- Icon above: profile card -->
    <g transform="translate(0, -80)">
      <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#fdfbf9" stroke="#9c3f00" stroke-width="1.5"/>
      <circle cx="0" cy="-8" r="6" fill="#f0c5a0"/>
      <path d="M-10,12 Q-10,2 0,2 Q10,2 10,12 Z" fill="#9c3f00" opacity="0.5"/>
      <line x1="-15" y1="16" x2="15" y2="16" stroke="#9c3f00" stroke-width="1.2" opacity="0.4"/>
    </g>
    <!-- Label -->
    <text x="0" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#9c3f00">Profil</text>
    <text x="0" y="62" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" fill="#6b5c54">je me présente</text>
  </g>

  <!-- ============ Step 2: Communauté ============ -->
  <g transform="translate(230, 170)">
    <circle cx="0" cy="0" r="22" fill="#9c3f00" opacity="0.9"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fdfbf9" stroke-width="3"/>
    <text x="0" y="5" font-family="Outfit, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#fdfbf9">2</text>
    <!-- Icon: room / door (pièce) -->
    <g transform="translate(0, -80)">
      <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#ffdbcc" stroke="#9c3f00" stroke-width="1.5"/>
      <!-- Door -->
      <rect x="-8" y="-10" width="16" height="22" fill="#7a3000"/>
      <rect x="-8" y="-10" width="16" height="22" fill="none" stroke="#5a2000" stroke-width="0.8"/>
      <circle cx="4" cy="2" r="1.2" fill="#fdfbf9"/>
      <!-- Roof line -->
      <path d="M-18,-10 L0,-20 L18,-10" stroke="#9c3f00" stroke-width="1.5" fill="none"/>
    </g>
    <text x="0" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#9c3f00">Pièce</text>
    <text x="0" y="62" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" fill="#6b5c54">je rejoins 1-2 communautés</text>
  </g>

  <!-- ============ Step 3: Forum ============ -->
  <g transform="translate(360, 170)">
    <circle cx="0" cy="0" r="22" fill="#c05814"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fdfbf9" stroke-width="3"/>
    <text x="0" y="5" font-family="Outfit, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#fdfbf9">3</text>
    <!-- Icon: chat bubble -->
    <g transform="translate(0, -80)">
      <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#fdfbf9" stroke="#c05814" stroke-width="1.5"/>
      <path d="M-14,-10 L14,-10 Q18,-10 18,-6 L18,5 Q18,9 14,9 L-4,9 L-12,15 L-10,9 L-14,9 Q-18,9 -18,5 L-18,-6 Q-18,-10 -14,-10 Z" fill="#c05814" opacity="0.18" stroke="#c05814" stroke-width="1.2"/>
      <circle cx="-6" cy="-1" r="1.4" fill="#c05814"/>
      <circle cx="0" cy="-1" r="1.4" fill="#c05814"/>
      <circle cx="6" cy="-1" r="1.4" fill="#c05814"/>
    </g>
    <text x="0" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#c05814">Forum</text>
    <text x="0" y="62" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" fill="#6b5c54">je dis bonjour</text>
  </g>

  <!-- ============ Step 4: Charte ============ -->
  <g transform="translate(490, 170)">
    <circle cx="0" cy="0" r="22" fill="#6b5c54"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fdfbf9" stroke-width="3"/>
    <text x="0" y="5" font-family="Outfit, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#fdfbf9">4</text>
    <!-- Icon: scroll / book -->
    <g transform="translate(0, -80)">
      <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#fdfbf9" stroke="#6b5c54" stroke-width="1.5"/>
      <rect x="-13" y="-13" width="26" height="26" rx="2" fill="#f3efec"/>
      <line x1="-9" y1="-7" x2="9" y2="-7" stroke="#6b5c54" stroke-width="1.2"/>
      <line x1="-9" y1="-2" x2="7" y2="-2" stroke="#6b5c54" stroke-width="1.2"/>
      <line x1="-9" y1="3" x2="9" y2="3" stroke="#6b5c54" stroke-width="1.2"/>
      <line x1="-9" y1="8" x2="5" y2="8" stroke="#6b5c54" stroke-width="1.2"/>
    </g>
    <text x="0" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#4a3728">Charte</text>
    <text x="0" y="62" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" fill="#6b5c54">je lis les règles de la maison</text>
  </g>

  <!-- ============ Step 5: Commun ============ -->
  <g transform="translate(610, 170)">
    <circle cx="0" cy="0" r="22" fill="#586330"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fdfbf9" stroke-width="3"/>
    <text x="0" y="5" font-family="Outfit, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#fdfbf9">5</text>
    <!-- Icon: shared toolbox / hand-heart -->
    <g transform="translate(0, -80)">
      <rect x="-22" y="-22" width="44" height="44" rx="6" fill="#dbe9a9" stroke="#586330" stroke-width="1.5"/>
      <!-- Heart/share icon -->
      <path d="M-10,2 Q-14,-3 -10,-7 Q-6,-10 0,-5 Q6,-10 10,-7 Q14,-3 10,2 Q5,8 0,12 Q-5,8 -10,2 Z" fill="#586330" opacity="0.5"/>
      <path d="M-10,2 Q-14,-3 -10,-7 Q-6,-10 0,-5 Q6,-10 10,-7 Q14,-3 10,2 Q5,8 0,12 Q-5,8 -10,2 Z" fill="none" stroke="#3d4d1f" stroke-width="1.2"/>
    </g>
    <text x="0" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3d4d1f">Commun</text>
    <text x="0" y="62" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" fill="#6b5c54">je repère un outil à suivre</text>
  </g>

  <!-- Progressive connector arrows between steps -->
  <g stroke="#9c3f00" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="3 3">
    <line x1="132" y1="170" x2="208" y2="170"/>
    <line x1="252" y1="170" x2="338" y2="170"/>
    <line x1="382" y1="170" x2="468" y2="170"/>
    <line x1="512" y1="170" x2="588" y2="170"/>
  </g>

  <!-- Top right small seedling (progression organic feel) -->
  <g transform="translate(660, 60)" opacity="0.55">
    <path d="M0,18 Q-1,8 0,-2" stroke="#586330" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="-6" cy="6" rx="6" ry="3" fill="#6d8035" transform="rotate(-25,-6,6)"/>
    <ellipse cx="5" cy="0" rx="5" ry="2.5" fill="#6d8035" transform="rotate(20,5,0)"/>
  </g>

  <!-- Bottom left small ground tuft -->
  <g transform="translate(50, 230)" opacity="0.4">
    <path d="M0,0 Q2,-10 4,0 M8,0 Q10,-8 12,0 M16,0 Q18,-10 20,0" stroke="#586330" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

</svg>
